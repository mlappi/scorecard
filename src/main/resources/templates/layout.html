<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Golf skinit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/app.css">
</head>
<body>
<header th:fragment="nav(active)" class="app-header">
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container">
            <a class="navbar-brand" href="/">
                <span class="brand-mark"></span>
                <span class="brand-text">Golf Skin Games</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">
<li class="nav-item">
                        <a class="nav-link" th:classappend="${active == 'home'} ? 'active' : ''" href="/">Info</a>
                    </li> <li class="nav-item">
                        <a class="nav-link" th:classappend="${active == 'games'} ? 'active' : ''" href="/game">Pelit</a>
                    </li> <li class="nav-item">
                        <a class="nav-link" th:classappend="${active == 'courses'} ? 'active' : ''" href="/course">Kentät</a>
                    </li> <li class="nav-item">
                        <a class="nav-link" th:classappend="${active == 'players'} ? 'active' : ''" href="/player">Pelaajat</a>
                    </li></ul>
            </div>
        </div>
    </nav>
</header>

<footer th:fragment="footer" class="app-footer">
    <div class="container">
        <div class="d-flex flex-wrap justify-content-between align-items-center">
            <span class="text-muted">Golf Skin Game Manager</span>
            <span class="text-muted">Built for quick rounds and clean scorecards</span>
        </div>
    </div>
</footer>

<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/fi.js"></script>
    <script>
        if (window.flatpickr) {
            flatpickr.localize(flatpickr.l10ns.fi);
            flatpickr('.js-datetime', {
                enableTime: true,
                time_24hr: true,
                dateFormat: 'd.m.Y H:i',
                minuteIncrement: 10
            });
        }
    </script>
</div>
</body>
</html>
