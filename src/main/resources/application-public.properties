# Immutable public deployment. The Docker entrypoint restores this database
# from deploy/public-seed before every application start.
spring.datasource.url=jdbc:hsqldb:file:${PUBLIC_DB_DIR:/tmp/scorecard-db}/devdb
spring.datasource.driver-class-name=org.hsqldb.jdbc.JDBCDriver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.read-only=true

app.admin.enabled=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
server.shutdown=graceful
