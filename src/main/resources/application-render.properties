# PostgreSQL datasource for Docker
# Activate with `-Dspring.profiles.active=postgres` or set `SPRING_PROFILES_ACTIVE=postgres` in environment

spring.datasource.url=jdbc:postgresql://localhost:5432/golf
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:golf}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=1
