# Render deployment with ephemeral admin access. The Docker entrypoint restores
# the versioned database before each start, so browser changes last only until
# the next restart or deploy.
spring.datasource.url=jdbc:hsqldb:file:${PUBLIC_DB_DIR:/tmp/scorecard-db}/devdb
spring.datasource.driver-class-name=org.hsqldb.jdbc.JDBCDriver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0

app.admin.enabled=true
admin.username=${ADMIN_USERNAME}
admin.password=${ADMIN_PASSWORD}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
server.shutdown=graceful
