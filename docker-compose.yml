services:
  db:
    image: postgres:latest
    container_name: scorecard-db
    environment:
      POSTGRES_DB: golf
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: golf
    ports:
      - "5432:5432"
    volumes:
      # Mount the host folder to /var/lib/postgresql (recommended for Postgres 18+)
      # This allows the image to create major-version-specific subdirectories
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
