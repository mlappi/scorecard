<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Players')}"></head>
<body class="app-body">
<div class="bg-glow"></div>
<header th:replace="~{layout :: nav('players')}"></header>
<main class="container py-4">
    <div class="page-header">
        <div>
            <h1>Pelaajat</h1>
            <p class="text-muted">Ylläpidä pelaajalistaa</p>
        </div>
        <div class="d-flex flex-wrap gap-2">
            <button class="btn btn-outline-dark" type="button" data-bs-toggle="collapse"
                    data-bs-target="#import-players" aria-expanded="false" aria-controls="import-players">Tuo pelaajat</button>
            <a class="btn btn-brand" href="/player/new">Uusi pelaaja</a>
        </div>
    </div>

    <form class="search-row" action="/player/search" method="post">
        <div class="input-group">
            <input type="text" name="playerName" class="form-control" placeholder="Hae etu- tai sukunimellä">
            <button class="btn btn-outline-dark" type="submit">Hae</button>
        </div>
    </form>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${errormessage}" class="alert alert-warning" th:text="${errormessage}"></div>

    <div class="collapse mt-3" id="import-players">
        <div class="card-surface">
            <form action="/player/import" method="post">
                <div class="row g-3">
                    <div class="col-lg-8">
                        <label class="form-label">Pelaajat (yksi per rivi)</label>
                        <textarea class="form-control" name="playerList" rows="6" required
                                  placeholder="Matti Meikäläinen&#10;Teemu Teurastaja&#10;Annika Sörsson"></textarea>
                        <div class="form-text">
                            Syötä etunimi ja sukunimi per rivi. HCP asetetaan 0 ja sähköpostia ei lisätä.
                        </div>
                    </div>
                </div>
                <div class="d-flex gap-2 mt-3">
                    <button class="btn btn-brand" type="submit">Tuo</button>
                    <button class="btn btn-outline-dark" type="button" data-bs-toggle="collapse"
                            data-bs-target="#import-players">Sulje</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card-surface">
        <div th:if="${players != null and !#lists.isEmpty(players)}" class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Nimi</th>
                        <th>HCP</th>
                        <th>Email</th>
                        <th class="text-end"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="player, iter : ${players}">
                        <td th:text="${iter.index + 1}"></td>
                        <td>
                            <a class="link-dark" th:href="@{/player/edit/{id}(id=${player.id})}" th:text="${player.firstName + ' ' + player.lastName}"></a>
                        </td>
                        <td th:text="${player.hcp}"></td>
                        <td th:text="${player.email}"></td>
                        <td class="text-end">
                            <a class="btn btn-sm btn-outline-danger" th:href="@{/player/remove/{id}(id=${player.id})}" onclick="return confirm('Poistetaanko pelaaja?');">Poista</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div th:if="${players == null or #lists.isEmpty(players)}" class="empty-state">
            <p>Ei pelaajia.</p>
        </div>
    </div>
</main>
<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
