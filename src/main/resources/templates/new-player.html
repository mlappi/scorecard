<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: head('Player')"></head>
<body class="app-body">
<div class="bg-glow"></div>
<header th:replace="layout :: nav('players')"></header>
<main class="container py-4">
    <div class="page-header">
        <div>
            <h1>Player</h1>
            <p class="text-muted">Add or update player details.</p>
        </div>
        <a class="btn btn-outline-dark" href="/player">Back</a>
    </div>

    <div class="card-surface">
        <form action="/player/save" method="post" class="row g-3" th:with="p=${player} ?: ${editPlayer}">
            <input type="hidden" name="id" th:value="${p.id}">
            <div class="col-md-6">
                <label class="form-label" for="firstName">First name</label>
                <input class="form-control" type="text" id="firstName" name="firstName" th:value="${p.firstName}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="lastName">Last name</label>
                <input class="form-control" type="text" id="lastName" name="lastName" th:value="${p.lastName}" required>
            </div>
            <div class="col-md-4">
                <label class="form-label" for="hcp">HCP</label>
                <input class="form-control" type="number" step="0.1" id="hcp" name="hcp" th:value="${p.hcp}">
            </div>
            <div class="col-md-8">
                <label class="form-label" for="email">Email</label>
                <input class="form-control" type="email" id="email" name="email" th:value="${p.email}" placeholder="first.last@email.com">
            </div>
            <div class="col-12 d-flex gap-2">
                <button class="btn btn-brand" type="submit">Save player</button>
                <a class="btn btn-outline-dark" href="/player">Back</a>
            </div>
        </form>
    </div>
</main>
<footer th:replace="layout :: footer"></footer>
<div th:replace="layout :: scripts"></div>
</body>
</html>
